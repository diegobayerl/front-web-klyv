<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 658"
  fill="none"
  role="img"
  aria-label="Klyv"
>
  <defs>

    <!-- BASE BRANCA -->
    <linearGradient
      id="whiteBase"
      x1="140"
      y1="300"
      x2="470"
      y2="540"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.48" stop-color="#F1F3F5"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- SUPERFÍCIE SUPERIOR -->
    <linearGradient
      id="whiteTop"
      x1="280"
      y1="350"
      x2="490"
      y2="100"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#ECEFF2"/>
      <stop offset="0.45" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- DOBRA -->
    <linearGradient
      id="whiteFold"
      x1="230"
      y1="270"
      x2="360"
      y2="400"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#AEB5BD"/>
      <stop offset="0.5" stop-color="#D7DBDF"/>
      <stop offset="1" stop-color="#F7F8F9"/>
    </linearGradient>

    <!-- INTERSEÇÃO -->
    <linearGradient
      id="whiteOverlap"
      x1="230"
      y1="275"
      x2="375"
      y2="355"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#9FA6AE"/>
      <stop offset="0.55" stop-color="#C8CDD2"/>
      <stop offset="1" stop-color="#E9ECEF"/>
    </linearGradient>

    <!-- SOMBRA DA DOBRA -->
    <filter
      id="foldShadow"
      x="-40%"
      y="-40%"
      width="180%"
      height="180%"
    >
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="10"
        flood-color="#000000"
        flood-opacity="0.16"
      />
    </filter>

  </defs>

  <!-- ====================== -->
  <!-- SÍMBOLO                -->
  <!-- ====================== -->

  <!-- BASE -->
  <path
    d="
      M108 347
      L228 278
      C241 270 257 270 271 278
      L516 421
      C543 437 543 463 516 479
      L384 555
      C366 566 344 566 326 555
      L107 428
      C82 413 82 362 108 347Z
    "
    fill="url(#whiteBase)"
  />

  <!-- DOBRA -->
  <path
    d="
      M227 253
      C227 237 244 228 258 236
      L387 311
      L278 397
      C255 415 227 399 227 370
      Z
    "
    fill="url(#whiteFold)"
    filter="url(#foldShadow)"
  />

  <!-- SUPERFÍCIE SUPERIOR -->
  <path
    d="
      M227 253
      C227 234 237 218 253 209
      L426 109
      C446 97 470 97 490 109
      L548 142
      C565 152 570 168 566 187
      L552 235
      C549 247 541 257 530 263
      L391 343
      C379 350 364 350 352 343
      L248 283
      C235 276 227 265 227 253Z
    "
    fill="url(#whiteTop)"
  />

  <!-- INTERSEÇÃO / PROFUNDIDADE -->
  <path
    d="
      M227 253
      C227 267 235 277 248 284
      L352 344
      C361 349 371 351 381 347
      L278 397
      C255 414 227 398 227 370
      Z
    "
    fill="url(#whiteOverlap)"
    opacity="0.92"
  />

  <!-- ====================== -->
  <!-- KLYV                   -->
  <!-- ====================== -->

  <text
    x="610"
    y="410"
    fill="#FFFFFF"
    font-family="Inter, Arial, sans-serif"
    font-size="205"
    font-weight="700"
    letter-spacing="-10"
  >Klyv</text>

</svg>